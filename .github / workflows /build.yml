name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: |
          D=$(dirname "$(find . -name gradlew -not -path './.git/*' | head -1)")
          cd "$D"
          chmod +x ./gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: '**/build/libs/*.jar'
